<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>3D-карта — DaviArt Craft</title>
<meta name="description" content="3D-карта миров сервера DaviArt Craft: каждый блок в объёме, приваты, зоны у спавнов, игроки онлайн.">
<meta name="theme-color" content="#14110e">
<meta property="og:title" content="3D-карта DaviArt Craft">
<meta property="og:image" content="https://daviart.com/img/og.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" crossorigin href="./assets/index-BgiqB2rB.css">
<style>
  /* шапка сайта; весь интерфейс BlueMap — ниже неё (transform делает #app «рамкой» для его fixed-элементов) */
  :root { --dh: 44px; }
  #dv-head { position: fixed; top: 0; left: 0; right: 0; height: var(--dh); z-index: 20000; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: rgba(20, 17, 14, .96); border-bottom: 1px solid rgba(255, 255, 255, .14);
    font: 500 15px Rubik, system-ui, sans-serif; color: #f1ece4; box-sizing: border-box; }
  #dv-head a { color: inherit; text-decoration: none; }
  #dv-head .dv-home { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dv-head .dv-home img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  #dv-head .dv-2d { margin-left: auto; flex: none; border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; padding: 6px 12px; background: rgba(255, 255, 255, .08); }
  #dv-head .dv-2d:hover { background: #6cc644; color: #fff; border-color: #6cc644; }
  @media (max-width: 420px) { #dv-head .dv-t2 { display: none; } }
  #map-container { position: fixed !important; top: var(--dh) !important; left: 0; right: 0; bottom: 0; width: auto !important; height: auto !important; }
  body > #app { top: var(--dh) !important; height: calc(100% - var(--dh)) !important; transform: translateZ(0); }
  #app #app { top: 0 !important; height: 100% !important; }
  #dv-boot { position: fixed; inset: var(--dh) 0 0 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;
    font: 16px Rubik, system-ui, sans-serif; color: #ccc; background: #111; }
</style>
</head>
<body>
<header id="dv-head">
  <a class="dv-home" href="/" aria-label="На главную"><img src="/img/icon-192.png" alt=""><span>DaviArt Craft<span class="dv-t2"> — 3D-карта</span></span></a>
  <a class="dv-2d" id="dv-2d" href="/map.html">← 2D-карта</a>
</header>
<noscript>Для 3D-карты нужен JavaScript. Обычная карта: <a href="/map.html">daviart.com/map.html</a></noscript>
<div id="dv-boot">Загрузка 3D-карты…</div>
<div id="map-container"></div>
<div id="app"></div>
<script>
/* У280 v3: BlueMap 5.16 на статичном хостинге. Данные — https://david-artur.github.io/daviart-3d/maps (см. settings.json).
   Сначала ставим bm-sw.js (распаковывает плитки .gz, даёт живых игроков), и когда он управляет страницей — запускаем BlueMap. */
(function () {
  var APP = "./assets/index-Pvo3QD2A.js";
  function start() {
    var b = document.getElementById("dv-boot"); if (b) b.remove();
    var s = document.createElement("script"); s.type = "module"; s.crossOrigin = ""; s.src = APP; document.head.appendChild(s);
  }
  function fail(msg) { document.getElementById("dv-boot").innerHTML = msg; }
  // «← 2D-карта» — то же место: BlueMap пишет адрес #мир:x:y:z:дистанция:…, карта сайта — #мир/x/z/зум
  document.getElementById("dv-2d").addEventListener("click", function () {
    var p = (location.hash || "").slice(1).split(":");
    if (p.length < 5 || !isFinite(+p[1]) || !isFinite(+p[3])) return;
    var zoom = 18 - Math.log2(Math.max(20, +p[4]) * 1.1 / Math.max(320, innerWidth));
    zoom = Math.round(Math.min(20, Math.max(13, zoom)) * 10) / 10;
    this.href = "/map.html#" + p[0] + "/" + Math.round(+p[1]) + "/" + Math.round(+p[3]) + "/" + zoom;
  });
  if (!("serviceWorker" in navigator) || typeof DecompressionStream === "undefined")
    return fail('Этот браузер слишком старый для 3D-карты.<br>Открой <a href="/map.html" style="color:#6cc644">обычную карту</a>.');
  navigator.serviceWorker.register("./bm-sw.js", { scope: "./" }).then(function () {
    if (navigator.serviceWorker.controller) return start();
    navigator.serviceWorker.addEventListener("controllerchange", start, { once: true });
  }, function (e) { fail("Не удалось запустить 3D-карту: " + e); });
})();
</script>
</body>
</html>
