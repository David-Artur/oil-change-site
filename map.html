<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта мира — DaviArt Craft</title>
<meta name="description" content="Карта миров сервера DaviArt Craft: Святые земли, Долины, Пограничье, Пустоши, Незер, Энд и лобби — прямо на сайте.">
<meta name="theme-color" content="#3d8a1e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:title" content="Карта мира DaviArt Craft">
<meta property="og:image" content="https://daviart.com/img/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/map.css?v=1">
</head>
<body>
<header class="mh">
  <a class="mh-home" href="/" aria-label="На главную"><img src="/img/icon-192.png" alt="" width="32" height="32"><span>DaviArt</span></a>
  <nav class="mh-worlds" id="worlds" aria-label="Миры"></nav>
  <a class="mh-3d" href="https://mc.daviart.com/map/" target="_blank" rel="noopener" title="Старая 3D-карта (BlueMap)">3D</a>
</header>
<div id="map" aria-label="Карта мира"></div>
<div class="mpanel">
  <div class="mcoord" id="coord">X — · Z —</div>
  <form class="mgo" id="go" autocomplete="off">
    <input id="gx" inputmode="numeric" placeholder="X" aria-label="Координата X">
    <input id="gz" inputmode="numeric" placeholder="Z" aria-label="Координата Z">
    <button type="submit">Найти</button>
  </form>
  <label class="mtog"><input type="checkbox" id="tclaims" checked> Приваты</label>
</div>
<div class="mnote" id="note">🧪 Новая карта — тест. Обновляется раз в несколько часов.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/map.js?v=1"></script>
</body>
</html>
